<div id="login-page">
    <div class="logo">LeadHub</div>
    <form id="login-form">
        <input type="text" class="glowing-input" placeholder="Username or Email" required>
        <input type="password" class="glowing-input" placeholder="Password" required>
        <button type="submit" class="glowing-button">Login</button>
    </form>
    <div class="signup-link">
        Don't have an account? <a href="#">Sign Up</a>
    </div>
</div>

<div id="disclaimer" class="disclaimer-popup">
    <div class="disclaimer-content">
        <h2>Disclaimer</h2>
        <p>LeadHub is an independent student-built project and is NOT officially affiliated with Lead City University. Use responsibly.</p>
        <button id="close-disclaimer" class="glowing-button">Acknowledge</button>
    </div>
</div>
