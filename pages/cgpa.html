<div id="cgpa-page">
    <h2>CGPA Calculator</h2>
    <div class="cgpa-container">
        <div class="input-section">
            <div class="glowing-card input-table">
                <table>
                    <thead>
                        <tr>
                            <th>Course Code</th>
                            <th>Course Units</th>
                            <th>Grade</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Rows will be added dynamically or pre-filled -->
                        <tr>
                            <td><input type="text" placeholder="e.g., CSC401"></td>
                            <td><input type="number" min="1" max="6" value="3"></td>
                            <td>
                                <select class="glowing-input">
                                    <option value="5">A</option>
                                    <option value="4">B</option>
                                    <option value="3">C</option>
                                    <option value="2">D</option>
                                    <option value="1">E</option>
                                    <option value="0">F</option>
                                </select>
                            </td>
                        </tr>
                         <tr>
                            <td><input type="text" placeholder="e.g., MTH302"></td>
                            <td><input type="number" min="1" max="6" value="3"></td>
                            <td>
                                <select class="glowing-input">
                                    <option value="5">A</option>
                                    <option value="4">B</option>
                                    <option value="3">C</option>
                                    <option value="2">D</option>
                                    <option value="1">E</option>
                                    <option value="0">F</option>
                                </select>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <button id="calculate-gpa" class="glowing-button" style="margin-top: 1rem;">Calculate GPA</button>
        </div>
        <div class="glowing-card grading-rubric">
            <h3>Grading Rubric</h3>
            <p>A = 5.0</p>
            <p>B = 4.0</p>
            <p>C = 3.0</p>
            <p>D = 2.0</p>
            <p>E = 1.0</p>
            <p>F = 0.0</p>
        </div>
    </div>
    <div id="gpa-result" class="glowing-card">
        <h3>Your Results</h3>
        <div class="gauge"></div>
        <!-- Results will be injected here by script.js -->
    </div>
</div>
