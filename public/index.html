<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeadHub</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;700&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="https://portal.lcu.edu.ng/assets/images/logo.png">
</head>
<body>
    <div id="app">
        <!-- Pages will be loaded here -->
    </div>
    <script type="module">
        // Import the functions you need from the SDKs you need
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics.js";
        import {
            getAuth,
            createUserWithEmailAndPassword,
            signInWithEmailAndPassword,
            signOut,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import {
            getFirestore,
            collection,
            addDoc,
            getDocs,
            onSnapshot,
            query,
            where,
            doc,
            deleteDoc,
            updateDoc
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        // Your web app's Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAPsmxTjOmrfZP5Goxlc0Q1l1FoHl1gOCE",
            authDomain: "leadhub-7a4d2.firebaseapp.com",
            projectId: "leadhub-7a4d2",
            storageBucket: "leadhub-7a4d2.appspot.com",
            messagingSenderId: "336333029570",
            appId: "1:336333029570:web:5113ef802cd5f6f7643b5b",
            measurementId: "G-QP9979PK4T"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const auth = getAuth(app);

        // Make auth and auth functions available globally for other scripts
        window.auth = auth;
        window.authFunctions = {
            createUserWithEmailAndPassword,
            signInWithEmailAndPassword,
            signOut,
            onAuthStateChanged
        };

        // Initialize Firestore and make it and its functions globally available
        const db = getFirestore(app);
        window.db = db;
        window.dbFunctions = {
            collection,
            addDoc,
            getDocs,
            onSnapshot,
            query,
            where,
            doc,
            deleteDoc,
            updateDoc
        };
    </script>
    <script src="auth.js"></script>
    <script src="notes.js"></script>
    <script src="script.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js')
                    .then(registration => {
                        console.log('ServiceWorker registration successful with scope: ', registration.scope);
                    })
                    .catch(error => {
                        console.log('ServiceWorker registration failed: ', error);
                    });
            });
        }
    </script>
</body>
</html>
