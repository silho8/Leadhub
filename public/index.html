<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeadHub</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="https://portal.lcu.edu.ng/assets/images/logo.png">
</head>
<body>
    <header id="main-header" style="display: none;">
        <nav class="top-navbar">
            <img src="https://portal.lcu.edu.ng/assets/images/logo.png" alt="Lead City University Logo" class="site-logo-nav">
            <div class="nav-links-container" id="main-nav-links">
                <!-- Links will be dynamically inserted here -->
            </div>
            <button class="hamburger-menu" id="hamburger-menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </nav>
    </header>
    <div id="app">
        <!-- Pages will be loaded here -->
    </div>

    <!-- Main application script, now a module -->
    <script type="module" src="script.js"></script>

    <!-- Service Worker registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js')
                    .then(registration => {
                        console.log('ServiceWorker registration successful with scope: ', registration.scope);
                    })
                    .catch(error => {
                        console.log('ServiceWorker registration failed: ', error);
                    });
            });
        }
    </script>
</body>
</html>
