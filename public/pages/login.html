<div id="login-page">
    <img src="https://portal.lcu.edu.ng/assets/images/logo.png" alt="Lead City University Logo" class="site-logo">
    <h2 id="form-title">Login</h2>
    <form id="auth-form">
        <input id="auth-name" type="text" class="app-input" placeholder="Your Name" style="display: none;">
        <input id="auth-email" type="email" class="app-input" placeholder="Email" required>
        <input id="auth-password" type="password" class="app-input" placeholder="Password" required>
        <input id="auth-confirm-password" type="password" class="app-input" placeholder="Confirm Password" style="display: none;">
        <button id="auth-button" type="submit" class="primary-button">Login</button>
    </form>
    <div class="toggle-link">
        <a href="#" id="toggle-auth-mode">Don't have an account? Sign Up</a>
    </div>
</div>

<div id="disclaimer" class="disclaimer-popup">
    <div class="disclaimer-content">
        <h2>Disclaimer</h2>
        <p>LeadHub is an independent student-built project and is NOT officially affiliated with Lead City University. Use responsibly.</p>
        <button id="close-disclaimer" class="primary-button">Acknowledge</button>
    </div>
</div>
