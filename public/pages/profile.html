<div id="profile-page">
    <h2>My Profile</h2>
    <div class="profile-container">
        <div class="ui-card user-info">
            <img src="https://via.placeholder.com/150" alt="Profile Picture" id="profile-pic" class="profile-picture">
            <label for="profile-pic-upload" class="primary-button upload-button">Change Picture</label>
            <input type="file" id="profile-pic-upload" accept="image/*" style="display: none;">

            <h3 id="profile-name">Loading...</h3>
            <p id="profile-email">Loading...</p>
        </div>
        <div class="ui-card user-settings">
            <h3>Settings</h3>
            <div class="settings-toggle">
                <span>Dark/Light Mode</span>
                <label class="switch">
                    <input type="checkbox" checked>
                    <span class="slider round"></span>
                </label>
            </div>
             <div class="settings-toggle">
                <span>Profile Visibility</span>
                <select class="app-input">
                    <option>Public</option>
                    <option>Classmates Only</option>
                    <option>Private</option>
                </select>
            </div>
            <button id="logout-button-profile" class="primary-button" style="margin-top: 1rem;">Log Out</button>
        </div>
    </div>
    <div class="ui-card stats-graph">
        <h3>CGPA Trend</h3>
        <!-- Placeholder for a graph -->
        <p>Graph showing CGPA over semesters would go here.</p>
    </div>
</div>
