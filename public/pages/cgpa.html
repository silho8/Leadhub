<div id="cgpa-page">
    <h2>CGPA Calculator</h2>
    <div class="cgpa-container">
        <div class="input-section">
            <div class="glowing-card input-table">
                <table>
                    <thead>
                        <tr>
                            <th>Course Code</th>
                            <th>Course Units</th>
                            <th>Grade</th>
                            <th></th> <!-- Header for remove button -->
                        </tr>
                    </thead>
                    <tbody id="cgpa-table-body">
                        <!-- Course rows will be dynamically inserted here -->
                    </tbody>
                </table>
            </div>
            <div class="cgpa-buttons" style="margin-top: 1rem; display: flex; gap: 1rem;">
                <button id="calculate-gpa" class="glowing-button">Calculate GPA</button>
                <button id="add-course-btn" class="glowing-button">Add Course</button>
            </div>
        </div>
        <div class="glowing-card grading-rubric">
            <h3>Grading Rubric</h3>
            <p>A = 5.0</p>
            <p>B = 4.0</p>
            <p>C = 3.0</p>
            <p>D = 2.0</p>
            <p>E = 1.0</p>
            <p>F = 0.0</p>
        </div>
    </div>
    <div id="gpa-result" class="glowing-card">
        <h3>Your Results</h3>
        <div class="gauge"></div>
        <!-- Results will be injected here by script.js -->
    </div>
</div>
