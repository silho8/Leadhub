My Notes
<div class="ui-card add-note-card">
    <h3>Add a New Note</h3>
    <form id="add-note-form" class="app-form">
        <input type="text" id="note-title" name="title" class="app-input" placeholder="Note Title" required>
        <textarea id="note-content" name="content" class="app-input" placeholder="What's on your mind?" rows="4" required></textarea>
        <button type="submit" class="primary-button">Save Note</button>
    </form>
</div>

<h3>All Notes</h3>
<div class="note-grid">
    <!-- Notes will be dynamically loaded here -->
    <p>Loading your notes...</p>
</div>
